env:
  height: 4
  width: 4
  n_agents: 2
  n_task_types: 11
  n_tasks: 1
  max_tasks_per_type: 1
  gamma: 0.99
  relatedness_width: 1
  proficiency_width: 5
  stochastic:
    spawn_prob: 0.16
    despawn_mode: probability
    despawn_prob: 0.1
    spawn_on_agent_cells: false
    spawn_at_round_end: true
    sigma_a: 2.0
    sigma_b: 8.0

model:
  encoder: everything_cnn_grid
  conv_specs: [[32, 3], [32, 3]]
  mlp_dims: [32]
  activation: leaky_relu
  weight_init: zero_bias

actor_model: null

train:
  learning_type: decentralized
  use_gpu: true
  td_lambda: 0.0
  total_steps: 1
  seed: 1234
  heuristic: eps_nearest
  discount_method: team_steps
  train_only_teammates: false
  lr:
    start: 0.003
    end: 0.003
    schedule: none
  epsilon:
    start: 0.0
    end: 0.0
    schedule: none

eval:
  eval_steps: 10000
  n_test_states: 1
  eval_seed: 0

logging:
  output_dir: runs/reward_pred_2agent_11task_4x4
