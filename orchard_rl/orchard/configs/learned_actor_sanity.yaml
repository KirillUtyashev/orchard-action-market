# Sanity point for the learned actor (spec section 6.6): 11 agents on a 9x9 grid,
# interest radius = proficiency radius = 3, sigma_a = 1, sigma_b = 8.
# Switch the critic with: --override train.learning_type=centralized
# Assumption to confirm: "model width 8" is read as conv [8,3] and one MLP layer of 8.
env:
  height: 9
  width: 9
  n_agents: 11
  n_task_types: 11
  n_tasks: 10
  max_tasks_per_type: 10
  gamma: 0.99
  relatedness_width: 3
  proficiency_width: 3
  stochastic:
    spawn_prob: 0.01
    despawn_prob: 0.0125
    despawn_mode: probability
    spawn_on_agent_cells: false
    spawn_at_round_end: false
    sigma_a: 1.0
    sigma_b: 8.0
    reward_generation: independent

model:
  encoder: everything_cnn_grid
  conv_specs: [[8, 3]]
  mlp_dims: [8]
  activation: leaky_relu
  weight_init: zero_bias

actor_model: null

train:
  learning_type: decentralized
  use_gpu: false
  td_lambda: 0.3
  total_steps: 3000000
  seed: 1234
  heuristic: nearest
  discount_method: round_steps
  # Critic lr and reward scale. With raw rewards (sigma_b=8, 11 agents) the critic diverged
  # to NaN even at lr 1e-3 / 3e-4 on some seeds (at 4k to 55k steps), and at the
  # reference lr 9e-3 within a few hundred steps (the value-based path too).
  # learned_actor.reward_scale: 0.1 below fixes this: on the seeds that diverged, lr 1e-3 and
  # 3e-4 both ran past the old failure points.
  lr: {start: 1e-3, end: 1e-3, schedule: none}
  epsilon: {start: 0.05, end: 0.05, schedule: none}
  actor_lr: {start: 3e-3, end: 3e-3, schedule: none}
  algorithm:
    name: actor_critic
    learned_actor:
      enabled: true
      advantage: afterstate
      entropy_coef: 0.01
      normalize_advantage: true
      eval_sampled: true
      reward_scale: 0.1
  stopping: {condition: none}

eval:
  eval_steps: 1000
  n_test_states: 50
  checkpoint_freq: 500000

logging:
  output_dir: output/runs/
  main_csv_freq: 50000
  detail_csv_freq: 500000
  timing_csv_freq: 0
